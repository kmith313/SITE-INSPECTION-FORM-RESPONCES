<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232e3c"/>
      <stop offset="100%" stop-color="#161d27"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc266"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- clipboard body -->
  <rect x="146" y="96" width="220" height="320" rx="22" fill="#131a22" stroke="#3a4656" stroke-width="6"/>
  <!-- clip top -->
  <rect x="206" y="76" width="100" height="40" rx="14" fill="#3a4656"/>
  <rect x="222" y="88" width="68" height="16" rx="8" fill="#131a22"/>

  <!-- checklist lines -->
  <circle cx="180" cy="176" r="9" fill="none" stroke="#4cae7d" stroke-width="6"/>
  <path d="M175 176 l4 5 l8 -10" stroke="#4cae7d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="204" y="170" width="118" height="12" rx="6" fill="#4a5666"/>

  <circle cx="180" cy="222" r="9" fill="none" stroke="#4cae7d" stroke-width="6"/>
  <path d="M175 222 l4 5 l8 -10" stroke="#4cae7d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="204" y="216" width="90" height="12" rx="6" fill="#4a5666"/>

  <circle cx="180" cy="268" r="9" fill="none" stroke="#e2543f" stroke-width="6"/>
  <path d="M175 268 l9 9 M184 268 l-9 9" stroke="#e2543f" stroke-width="5" stroke-linecap="round"/>
  <rect x="204" y="262" width="104" height="12" rx="6" fill="#4a5666"/>

  <!-- bolt / hazard accent lower half -->
  <path d="M300 300 l-52 62 h34 l-14 46 l58 -68 h-34 z" fill="url(#amber)"/>

  <!-- hazard stripe footer -->
  <rect x="146" y="392" width="220" height="10" fill="#0d1712" opacity="0"/>
</svg>
